<script>
(async function () {
  var P = JSON.parse(document.getElementById('sealed').textContent), KEY = 'cutsSiteKey:' + P.salt;
  var bytes = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var b64 = function (u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var form = document.getElementById('gate'), err = document.getElementById('err'), wait = document.getElementById('wait');
  var unseal = async function (raw) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data));
    return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  };
  var show = function (page) {
    var hash = location.hash;
    document.open(); document.write(page); document.close();
    if (hash.length > 1) { var el = document.getElementById(decodeURIComponent(hash.slice(1))); if (el) el.scrollIntoView(); }
  };
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    wait.textContent = 'This browser is too old to open this page. Please update it (iOS 16.4 or newer).';
    return;
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try { show(await unseal(bytes(saved))); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
  }
  wait.hidden = true; form.hidden = false;
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = form.querySelector('button'); btn.disabled = true; err.textContent = '';
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value.trim()), 'PBKDF2', false, ['deriveBits']);
      var raw = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(P.salt), iterations: P.iter }, base, 256));
      var page = await unseal(raw);
